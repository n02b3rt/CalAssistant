services:
  # ---------------------------------------------------------------------------
  # LLM — only started with: docker compose --profile bundled-ollama up
  # Without GPU this runs on CPU and is VERY slow. Prefer host Ollama instead.
  # ---------------------------------------------------------------------------
  ollama:
    profiles: [bundled-ollama]
    image: ollama/ollama:latest
    container_name: calassistant-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    profiles: [bundled-ollama]
    image: ollama/ollama:latest
    container_name: calassistant-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3:4b"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # App — Blazor Server (UI rendered server-side via SignalR)
  # ---------------------------------------------------------------------------
  calassistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calassistant-app
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      EnableHttpsRedirection: "false"
      # Default: Ollama on the Windows host (fast — uses your GPU natively).
      # With --profile bundled-ollama: talks to the ollama container instead.
      MaIN__OllamaBaseUrl: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token-store:/app/token-store
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        required: false

  # ---------------------------------------------------------------------------
  # Gateway — nginx reverse proxy (public entry point: http://localhost:8080)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: calassistant-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - calassistant

volumes:
  ollama_data:
